name: Docs

on:
  push:
    branches: [sandboxbio-embed]
  workflow_dispatch:

# Pages deploys need these; one run at a time so two pushes can't race the deploy
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.13 removed imghdr, which Sphinx 5 still imports
          python-version: "3.12"

      # sphinx<6 matches what readthedocs builds this with (the published site still ships
      # jQuery and underscore, dropped in Sphinx 6); matplotlib is needed for plot_directive
      - run: pip install "sphinx<6" matplotlib

      - run: make html
        working-directory: docs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
